<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HBD My Beloved Wife ❤️</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Tahoma', sans-serif; }
        canvas { display: block; z-index: 1; }
        
        /* --- ปุ่มกล่องของขวัญกลางจอ --- */
        /* --- กล่องของขวัญสไตล์ไอคอน --- */
        /* --- กล่องของขวัญสไตล์ไอคอน --- */
        #gift-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 180px;
            background-color: #ff4d6d;
            border-radius: 10px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            animation: bounce 1.2s infinite ease-in-out;
        }

        /* ฝากล่อง */
        .gift-lid {
            position: absolute;
            top: -20px;
            width: 220px;
            height: 45px;
            background-color: #ff758f;
            border-radius: 5px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            z-index: 2;
        }

        /* ริบบิ้นแนวตั้ง */
        .ribbon-v {
            position: absolute;
            width: 40px;
            height: 100%;
            background-color: #FFCCCC;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* โบว์ข้างบน */
        #bow {
            position: absolute;
            top: -85px;
            font-size: 110px;
            z-index: 3;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        /* ข้อความบนกล่อง - ปรับให้ลอยอยู่บนสุด */
        #click-text {
            position: relative; /* เปลี่ยนเป็น relative เพื่อให้ z-index ทำงาน */
            z-index: 10; 
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
            width: 100%;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08) translateY(-10px); }
        }

        #gift-btn:hover {
            filter: brightness(1.1);
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(5deg); }
            75% { transform: translate(-50%, -50%) rotate(-5deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        /* --- ชั้นข้อความขยายใหญ่พิเศษ --- */
        #text-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        #quote-text {
            color: white; font-size: 80px; font-weight: bold; text-align: center;
            text-shadow: 0 0 30px #ff4d6d, 0 0 10px #000;
            opacity: 0; transition: opacity 1s; padding: 0 40px; line-height: 1.2;
        }
    </style>
</head>

        const thumbs = [];
        for(let i=1; i<=70; i++) { 
            const img = new Image();
            img.src = `photos/${i}.jpg`;
            thumbs.push(img);
        }

        const loveQuotes = [
            "สุขสันต์วันเกิดนะจ๊ะ...<br>เมียสุดที่รัก ❤️",
            "ขอให้ที่รัก...<br>มีความสุขที่สุดในโลก ❤️",
            "ขอให้รอยยิ้มของเธอ<br>สดใสแบบนี้ในทุกๆ วัน",
            "ขอให้ปีนี้เป็นปีที่ดี<br>สมหวังในทุกสิ่งที่ตั้งใจ",
            "ขอให้สุขภาพแข็งแรง<br>อยู่เป็นความสุขของกันและกันนะ",
            "ขอให้เรารักกันมากขึ้น<br>ในทุกๆ วันที่ผ่านไป",
            "ขอให้ของขวัญชิ้นนี้<br>แทนความในใจทั้งหมดของฉัน..."
        ];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function startStory() {
            if (isRunning) return;
            bgMusic.play().catch(e => console.log("Music play blocked"));
            giftBtn.style.display = 'none';
            
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            const scale = Math.min(canvas.width / mainImg.width, canvas.height / mainImg.height) * 0.9;
            const w = mainImg.width * scale;
            const h = mainImg.height * scale;
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tCtx.drawImage(mainImg, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);

            const imgData = tCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            const gap = 8; 

            for (let y = 0; y < canvas.height; y += gap) {
                for (let x = 0; x < canvas.width; x += gap) {
                    const i = (y * canvas.width + x) * 4;
                    if (imgData[i+3] > 50) { 
                        particles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            tx: x, ty: y,
                            color: `rgb(${imgData[i]},${imgData[i+1]},${imgData[i+2]})`,
                            img: thumbs[Math.floor(Math.random() * thumbs.length)],
                            currentSize: 120,
                            vx: (Math.random() - 0.5) * 2.5,
                            vy: (Math.random() - 0.5) * 2.5
                        });
                    }
                }
            }
            isRunning = true;
            requestAnimationFrame(animate);
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                if (elapsed <= 30000) {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                } else if (elapsed <= 45000) {
                    const prog = (elapsed - 30000) / 15000;
                    p.currentSize = 120 - (prog * 112);
                    p.x += (p.tx - p.x) * 0.05;
                    p.y += (p.ty - p.y) * 0.05;
                } else {
                    p.currentSize = 8;
                    p.x = p.tx; p.y = p.ty;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.globalAlpha = (elapsed <= 30000) ? 0.9 : 0.5;
                if(p.img.complete) ctx.drawImage(p.img, -p.currentSize/2, -p.currentSize/2, p.currentSize, p.currentSize);
                
                if (elapsed > 30000) {
                    const tint = Math.min(0.7, (elapsed - 30000) / 10000);
                    ctx.globalAlpha = tint;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.currentSize/2, -p.currentSize/2, p.currentSize, p.currentSize);
                }
                ctx.restore();
            });

            const cycle = Math.floor(elapsed / 5000);
            if (cycle < loveQuotes.length && elapsed < 30000) {
                quoteText.innerHTML = loveQuotes[cycle];
                const timeInCycle = elapsed % 5000;
                if (timeInCycle < 1000) quoteText.style.opacity = timeInCycle / 1000;
                else if (timeInCycle > 4000) quoteText.style.opacity = (5000 - timeInCycle) / 1000;
                else quoteText.style.opacity = 1;
            } else {
                quoteText.style.opacity = 0;
            }

            if (elapsed > 45000) {
                const alpha = Math.min(0.4, (elapsed - 45000) / 15000);
                ctx.save();
                ctx.globalAlpha = alpha;
                const s = Math.min(canvas.width/mainImg.width, canvas.height/mainImg.height) * 0.9;
                ctx.drawImage(mainImg, (canvas.width-mainImg.width*s)/2, (canvas.height-mainImg.height*s)/2, mainImg.width*s, mainImg.height*s);
                ctx.restore();
            }

            if (elapsed > 50000) {
                ctx.save();
                ctx.fillStyle = "white";
                ctx.font = "bold 60px Tahoma";
                ctx.textAlign = "center";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#ff4d6d";
                ctx.fillText("Happy Birthday My Beloved Wife ❤️", canvas.width/2, canvas.height / 2 + 100);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }
    </script>
