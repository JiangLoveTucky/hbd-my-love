        const thumbs = [];
        const totalPhotos = 20; 
        for(let i=1; i<=totalPhotos; i++) { 
            const img = new Image();
            img.src = `photos/${i}.jpg`; 
            thumbs.push(img);
        }
        // ==========================================

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function startStory() {
            if (isRunning) return;
            
            // เล่นเพลงทันทีที่คลิก
            bgMusic.play().catch(e => console.log("Audio play failed", e));
            
            btn.style.display = 'none';
            
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            
            const scale = Math.min(canvas.width / mainImg.width, canvas.height / mainImg.height) * 0.9;
            const w = mainImg.width * scale;
            const h = mainImg.height * scale;
            const offX = (canvas.width - w) / 2;
            const offY = (canvas.height - h) / 2;

            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tCtx.drawImage(mainImg, offX, offY, w, h);

            const imgData = tCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            const gap = 8; // Pixel เล็กละเอียด

            for (let y = 0; y < canvas.height; y += gap) {
                for (let x = 0; x < canvas.width; x += gap) {
                    const i = (y * canvas.width + x) * 4;
                    if (imgData[i+3] > 50) { 
                        particles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            tx: x, ty: y,
                            color: `rgb(${imgData[i]},${imgData[i+1]},${imgData[i+2]})`,
                            img: thumbs[Math.floor(Math.random() * thumbs.length)],
                            currentSize: 120, // เริ่มต้นขนาดใหญ่
                            vx: (Math.random() - 0.5) * 1.5, // ความเร็วลอยไปมา
                            vy: (Math.random() - 0.5) * 1.5
                        });
                    }
                }
            }
            isRunning = true;
            requestAnimationFrame(animate);
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                // 1. ช่วง 0-30 วิ: รูปใหญ่ลอยไปมาโชว์ความทรงจำ
                if (elapsed <= 30000) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                }
                // 2. ช่วง 30-40 วิ: ย่อส่วนและบินเข้ารวมร่าง
                else if (elapsed <= 40000) {
                    const progress = (elapsed - 30000) / 10000;
                    p.currentSize = 120 - progress * (120 - 8); 
                    p.x += (p.tx - p.x) * 0.08;
                    p.y += (p.ty - p.y) * 0.08;
                }
                // 3. ช่วง 40 วิ+: ประกอบร่างสมบูรณ์
                else {
                    p.currentSize = 8;
                    p.x += (p.tx - p.x) * 0.05;
                    p.y += (p.ty - p.y) * 0.05;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                
                if(p.img.complete) {
                    // ช่วงแรกโชว์รูปชัดๆ (Alpha 0.9) ช่วงหลังให้จางลงเพื่อให้เห็นสีรวม (Alpha 0.5)
                    ctx.globalAlpha = (elapsed <= 30000) ? 0.9 : 0.5;
                    ctx.drawImage(p.img, -p.currentSize/2, -p.currentSize/2, p.currentSize, p.currentSize);
                }
                
                // แต้มสีจากรูปหลัก (เริ่มวินาทีที่ 30)
                if (elapsed > 30000) {
                    const tintOpacity = Math.min(0.7, (elapsed - 30000) / 10000);
                    ctx.globalAlpha = tintOpacity;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.currentSize/2, -p.currentSize/2, p.currentSize, p.currentSize);
                }
                ctx.restore();
            });

            // 4. วินาทีที่ 40: ค่อยๆ Fade-in รูปหลักตัวจริงทับลางๆ เพื่อความคมชัด
            if (elapsed > 40000) {
                const fade = Math.min(0.35, (elapsed - 40000) / 20000); 
                ctx.globalAlpha = fade;
                const scale = Math.min(canvas.width / mainImg.width, canvas.height / mainImg.height) * 0.9;
                const w = mainImg.width * scale;
                const h = mainImg.height * scale;
                ctx.drawImage(mainImg, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
            }

            // 5. วินาทีที่ 55+: แสดงข้อความปิดท้าย
            if (elapsed > 55000) {
                ctx.globalAlpha = Math.min(1, (elapsed - 55000) / 3000);
                ctx.fillStyle = "white";
                ctx.font = "bold 32px Tahoma";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff4d6d";
                ctx.fillText("Happy Birthday My Beloved Wife ❤️", canvas.width/2, canvas.height - 60);
            }

            requestAnimationFrame(animate);
        }
    </script>
